                doc.setTextColor(darkText[0], darkText[1], darkText[2]);
                doc.setFont(undefined, 'normal');
                
                const addrLine1 = `${client?.street || '---'}, Nº ${client?.number || 'S/N'}`;
                const addrLine2 = `Bairro: ${client?.neighborhood || '---'} | QD: ${client?.block || '---'}`;
                const addrLine3 = `${client?.city || '---'} - ${client?.state?.toUpperCase() || '--'}`;

                doc.save(`PEDIDO_${sale.id}_${sale.clientName.replace(/\s+/g, '_')}.pdf`);
            } catch (err) {

        }

        function getMonthRange(yyyyMm) {
            const [y, m] = yyyyMm.split('-').map(Number);
            const start = `${yyyyMm}-01`;
            const endDate = new Date(y, m, 0);
            const end = localDate(endDate);
            return { start, end };
        }

        function formatPercent(val) {
            return `${(val * 100).toFixed(1)}%`;
        }

        function groupSum(items, keyFn, amountFn) {
            const map = new Map();
            items.forEach(i => {
                const k = keyFn(i) || 'Sem categoria';
                const v = amountFn(i) || 0;
                map.set(k, (map.get(k) || 0) + v);
            });
            return Array.from(map.entries())
                .map(([key, value]) => ({ key, value }))
                .sort((a, b) => b.value - a.value);
        }

        function computeFinanceDRE(start, end) {
            const transactions = appState.transactions.filter(t => t.date && (!start || t.date >= start) && (!end || t.date <= end));
            const entradas = transactions.filter(t => t.type === 'entrada');
            const saidas = transactions.filter(t => t.type === 'saida');

            const totalIn = entradas.reduce((acc, t) => acc + (t.amount || 0), 0);
            const totalOut = saidas.reduce((acc, t) => acc + (t.amount || 0), 0);
            
            // Separar taxas de cartão para destaque
            const totalFees = saidas.filter(t => t.category === 'Taxas de Cartão').reduce((acc, t) => acc + (t.amount || 0), 0);
            const net = totalIn - totalOut;

            const entradasByCategory = groupSum(entradas, t => t.category || 'Sem categoria', t => t.amount);
            const saidasByCategory = groupSum(saidas, t => t.category || 'Sem categoria', t => t.amount);

            const byAccount = groupSum(transactions, t => t.account || 'Sem conta', t => (t.type === 'entrada' ? (t.amount || 0) : -(t.amount || 0)));
            const byPayment = groupSum(transactions, t => t.paymentMethod || 'Sem método', t => (t.type === 'entrada' ? (t.amount || 0) : -(t.amount || 0)));

            const completedSales = appState.sales
                .filter(s => s.status === 'completed' && s.date && (!start || s.date >= start) && (!end || s.date <= end));
            
            // Agrupamento por produto (Faturamento Bruto)
            const salesByProductMap = new Map();
            completedSales.forEach(s => {
                (s.items || []).forEach(item => {
                    const name = item.name || 'Produto';
                    const amount = (item.price || 0) * (item.qty || 0);
                    salesByProductMap.set(name, (salesByProductMap.get(name) || 0) + amount);
                });
            });
            const salesByProduct = Array.from(salesByProductMap.entries())
                .map(([key, value]) => ({ key, value }))
                .sort((a, b) => b.value - a.value);

            const pendingSalesCount = appState.sales.filter(s => s.status === 'pending').length;
            const salesCount = completedSales.length;
            const salesGross = completedSales.reduce((acc, s) => acc + (s.total || 0), 0);
            
            // Calcular taxas específicas das vendas do período (para faturamento líquido)
            const periodSaleIds = completedSales.map(s => s.id);
            const salesFees = saidas
                .filter(t => t.category === 'Taxas de Cartão' && (
                    (t.saleId && periodSaleIds.includes(t.saleId)) || 
                    (t.description.includes('#') && periodSaleIds.some(id => t.description.includes('#' + id)))
                ))
                .reduce((acc, t) => acc + (t.amount || 0), 0);
            const salesNet = salesGross - salesFees;

            const salesAvg = salesCount > 0 ? (salesGross / salesCount) : 0;
            const itemsSold = completedSales.reduce((acc, s) => acc + (s.items || []).reduce((sum, i) => sum + (i.qty || 0), 0), 0);

            return {
                totalIn,
                totalOut,
                totalFees, // Adicionado
                net,
                entradasByCategory,
                saidasByCategory,
                salesByProduct, // Adicionado
                byAccount,
                byPayment,
                salesCount,
                salesGross,
                salesNet, // Adicionado
                salesAvg,
                itemsSold,
                pendingSalesCount
            };
        }

        function setDREPreset(preset) {
            const now = new Date();
            const today = localDate(now);
            let start = '';
            let end = '';

            if (preset === 'this_month') {
                const m = localDate(now).slice(0, 7);
                const range = getMonthRange(m);
                start = range.start;
                end = range.end;
            } else if (preset === 'last_month') {
                const d = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                const m = localDate(d).slice(0, 7);
                const range = getMonthRange(m);
                start = range.start;
                end = range.end;
            } else if (preset === 'last_30') {
                const d = new Date(now);
                d.setDate(d.getDate() - 30);
                start = localDate(d);
                end = today;
            } else if (preset === 'all') {
                start = '';
                end = '';
            }

            const startEl = document.getElementById('dre-start');
            const endEl = document.getElementById('dre-end');
            if (startEl) startEl.value = start;
            if (endEl) endEl.value = end;
            applyDREFilters();
        }

        function computeRealProductCostReport(start, end, productId, clientId) {
            const sales = appState.sales.filter(s => {
                const isConfirmedDelivery = s.status === 'completed' && !!s.deliveryDate;
                if (!isConfirmedDelivery) return false;
                if (start && s.deliveryDate < start) return false;
                if (end && s.deliveryDate > end) return false;
                if (clientId && String(s.clientId || 0) !== String(clientId)) return false;
                return true;
            });

            const rows = [];
            sales.forEach(sale => {
                const helperCount = sale.deliveryHelperCount ?? 1;
                const helperFeePerUnit = sale.deliveryHelperFeePerUnit ?? 0;
                (sale.items || []).forEach(item => {
                    const p = appState.inventory.find(x => x.id === item.productId);
                    if (productId && String(item.productId) !== String(productId)) return;

                    const qty = item.qty || 0;
                    const displayQty = item.isMeter ? (item.units || 1) : qty;
                    const revenue = (item.price || 0) * qty;
                    const fabricationCost = saleItemCost(item) * qty;
                    const recordedHelper = (sale.deliveryHelperItems || []).find(h => h.productId === item.productId);
                    const effectiveHelperFee = recordedHelper ? recordedHelper.helperFee : (sale.deliveryHelperFeePerUnit ?? p?.helperFee ?? 0);
                    const helperCost = displayQty * helperCount * effectiveHelperFee;
                    const totalCost = fabricationCost + helperCost;
                    const profit = revenue - totalCost;

                    rows.push({
                        saleId: sale.id,
                        deliveryDate: sale.deliveryDate || sale.date,
                        clientId: sale.clientId || 0,
                        clientName: sale.clientName || '',
                        productId: item.productId,
                        productName: item.name || p?.name || 'Produto',
                        qty: displayQty,
                        totalMeters: item.isMeter ? qty : 0,
                        isMeter: !!item.isMeter,
                        revenue,
                        fabricationCost,
                        helperCount,
                        helperFeePerUnit: effectiveHelperFee,
                        helperCost,
                        totalCost,
                        profit
                    });
                });
            });

            rows.sort((a, b) => (b.deliveryDate || '').localeCompare(a.deliveryDate || '') || (b.saleId - a.saleId));

            const totals = rows.reduce((acc, r) => {
                acc.totalQty += r.qty;
                acc.totalRevenue += r.revenue;
                acc.totalFabrication += r.fabricationCost;
                acc.totalHelpers += r.helperCost;
                acc.totalProfit += r.profit;
                return acc;
            }, { totalQty: 0, totalRevenue: 0, totalFabrication: 0, totalHelpers: 0, totalProfit: 0 });

            return { rows, totals };
        }

            const data = computeRealProductCostReport(start, end, productId, clientId);
            const container = document.getElementById('rc-content');
            if (!container) return;

            container.innerHTML = renderRealProductCostReport(data);
            lucide.createIcons();
        }

                const thisMonth = localDate(now).slice(0, 7);
                const lastMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
                const lastMonth = localDate(lastMonthDate).slice(0, 7);
                
                const purchases = (appState.stockMovements || []).filter(m => m.type === 'entrada');
                
                const getMonthStats = (month) => {
                    const monthPurchases = purchases.filter(p => p.date.startsWith(month));
                    const stats = {};
                    monthPurchases.forEach(p => {
                        if (!stats[p.productId]) {
                            stats[p.productId] = { name: p.productName, totalQty: 0, totalSpent: 0, productId: p.productId };
                        }
                        stats[p.productId].totalQty += p.qty;
                        stats[p.productId].totalSpent += p.totalPrice;
                    });
                    Object.values(stats).forEach(s => {
                        s.avgPrice = s.totalQty > 0 ? s.totalSpent / s.totalQty : 0;
                    });
                    return stats;
                };

                const currentStats = getMonthStats(thisMonth);
                const previousStats = getMonthStats(lastMonth);
                
                const totalSpentThisMonth = Object.values(currentStats).reduce((acc, s) => acc + s.totalSpent, 0);
                const totalSpentLastMonth = Object.values(previousStats).reduce((acc, s) => acc + s.totalSpent, 0);
                const diffPercent = totalSpentLastMonth > 0 ? ((totalSpentThisMonth - totalSpentLastMonth) / totalSpentLastMonth * 100).toFixed(1) : 0;

                content = `
                    <div class="space-y-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="p-4 bg-blue-50 dark:bg-blue-900/20 rounded-xl border border-blue-100 dark:border-blue-800">
                                <p class="text-[10px] font-bold text-blue-600 uppercase mb-1">Total Gasto (Este Mês)</p>
                                <p class="text-xl font-black text-blue-600">${formatCurrency(totalSpentThisMonth)}</p>
                                <p class="text-[10px] ${diffPercent >= 0 ? 'text-red-500' : 'text-green-500'} font-bold mt-1">
                                    ${totalSpentLastMonth > 0 ? (diffPercent >= 0 ? '↑' : '↓') + ' ' + Math.abs(diffPercent) + '% em relação ao mês anterior' : 'Primeiro mês com registros'}
                                </p>
                            </div>
                            <div class="p-4 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700">
                                <p class="text-[10px] font-bold text-slate-500 uppercase mb-1">Insumos Comprados</p>
                                <p class="text-xl font-black dark:text-white">${Object.keys(currentStats).length}</p>
                                <p class="text-[10px] text-slate-400 mt-1">Total de itens diferentes este mês</p>
                            </div>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-[11px] text-left">
                                <thead class="bg-slate-50 dark:bg-slate-700/50 text-slate-500">
                                    <tr>
                                        <th class="px-2 py-3 font-black uppercase tracking-widest">Insumo</th>
                                        <th class="px-2 py-3 text-right font-black uppercase tracking-widest">Qtd</th>
                                        <th class="px-2 py-3 text-right font-black uppercase tracking-widest">Média Un.</th>
                                        <th class="px-2 py-3 text-right font-black uppercase tracking-widest">Mês Ant.</th>
                                        <th class="px-2 py-3 text-right font-black uppercase tracking-widest">Var.</th>
                                        <th class="px-2 py-3 text-right font-black uppercase tracking-widest">Total</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 dark:divide-slate-700">
                                    ${Object.values(currentStats).length > 0 ? Object.values(currentStats).sort((a,b) => b.totalSpent - a.totalSpent).map(s => {
                                        const prev = previousStats[s.productId];
                                        const varPercent = prev && prev.avgPrice > 0 ? ((s.avgPrice - prev.avgPrice) / prev.avgPrice * 100).toFixed(1) : null;
                                        return `
                                            <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/30">
                                                <td class="px-2 py-3 font-bold text-slate-900 dark:text-white">${escapeHtml(s.name)}</td>
                                                <td class="px-2 py-3 text-right font-medium">${s.totalQty.toFixed(1)}</td>
                                                <td class="px-2 py-3 text-right font-medium">${formatCurrency(s.avgPrice)}</td>
                                                <td class="px-2 py-3 text-right text-slate-400">${prev ? formatCurrency(prev.avgPrice) : '-'}</td>
                                                <td class="px-2 py-3 text-right font-black ${varPercent > 0 ? 'text-red-500' : varPercent < 0 ? 'text-green-500' : 'text-slate-400'}">
                                                    ${varPercent !== null ? (varPercent > 0 ? '+' : '') + varPercent + '%' : 'Novo'}
                                                </td>
                                                <td class="px-2 py-3 text-right font-black text-slate-900 dark:text-white">${formatCurrency(s.totalSpent)}</td>
                                            </tr>
                                        `;
                                    }).join('') : '<tr><td colspan="6" class="px-2 py-8 text-center text-slate-400 italic text-xs">Nenhuma compra registrada este mês.</td></tr>'}
                                </tbody>
                            </table>
                        </div>

                        ${Object.values(currentStats).length > 0 ? `

                                <i data-lucide="trending-up" class="w-3.5 h-3.5 text-primary-500"></i>
                                Evolução de Preços (Top 3 Itens)

                            <div class="h-48 w-full">
                                <canvas id="priceEvolutionChart"></canvas>
                            </div>
                        </div>
                        ` : ''}
                    </div>
                `;

                if (Object.values(currentStats).length > 0) {
                    setTimeout(() => {
                        const canvas = document.getElementById('priceEvolutionChart');
                        if (!canvas) return;
                        const ctx = canvas.getContext('2d');
                        const last6Months = [];
                        for(let i=5; i>=0; i--) {
                            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                            last6Months.push(localDate(d).slice(0, 7));
                        }

                        const topItems = Object.values(currentStats)
                            .sort((a,b) => b.totalSpent - a.totalSpent)
                            .slice(0, 3);

                        const datasets = topItems.map((item, idx) => {
                            const colors = ['#3b82f6', '#8b5cf6', '#ec4899'];
                            return {
                                label: item.name,
                                data: last6Months.map(m => {
                                    const mPurchases = purchases.filter(p => p.productId === item.productId && p.date.startsWith(m));
                                    if (mPurchases.length === 0) return null;
                                    const totalQ = mPurchases.reduce((acc, p) => acc + p.qty, 0);
                                    const totalS = mPurchases.reduce((acc, p) => acc + p.totalPrice, 0);
                                    return totalS / totalQ;
                                }),
                                borderColor: colors[idx],
                                backgroundColor: colors[idx] + '10',
                                borderWidth: 2,
                                tension: 0.3,
                                fill: true,
                                spanGaps: true,
                                pointRadius: 3,
                                pointBackgroundColor: colors[idx]
                            };
                        });

                        new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: last6Months.map(m => {
                                    const [year, month] = m.split('-');
                                    const months = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
                                    return months[parseInt(month)-1];
                                }),
                                datasets: datasets
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: { position: 'bottom', labels: { boxWidth: 8, font: { size: 9, weight: 'bold' }, usePointStyle: true } },
                                    tooltip: {
                                        callbacks: {
                                            label: (context) => `${context.dataset.label}: ${formatCurrency(context.parsed.y)}`
                                        }
                                    }
                                },
                                scales: {
                                    y: { beginAtZero: false, ticks: { font: { size: 8 }, callback: (val) => 'R$ ' + val } },
                                    x: { ticks: { font: { size: 8 } } }
                                }
                            }
                        });
                        lucide.createIcons();
                    }, 200);
                }
            } else if (type === 'caixa') {
                title = "Relatório de Fluxo de Caixa";
                
                // Configuração inicial de filtros
                const now = new Date();
                const last30Days = new Date(now);
                last30Days.setDate(now.getDate() - 30);
                const defaultStart = last30Days.toISOString().split('T')[0];
                const defaultEnd = localDate(now);

                content = `
                    <div class="space-y-6">
                        <div class="bg-slate-50 dark:bg-slate-700/50 p-4 rounded-2xl border border-slate-100 dark:border-slate-700 space-y-4">

                                <button onclick="setCaixaReportPreset('last_7')" class="py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 font-black text-[9px] uppercase tracking-widest hover:bg-primary-50 hover:text-primary-600 transition-all">7 dias</button>
                                <button onclick="setCaixaReportPreset('last_30')" class="py-2 rounded-xl bg-primary-600 text-white font-black text-[9px] uppercase tracking-widest hover:brightness-95 transition-all shadow-sm">30 dias</button>
                                <button onclick="setCaixaReportPreset('this_month')" class="py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 font-black text-[9px] uppercase tracking-widest hover:bg-primary-50 hover:text-primary-600 transition-all">Este mês</button>
                                <button onclick="setCaixaReportPreset('all')" class="py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 text-slate-600 dark:text-slate-300 font-black text-[9px] uppercase tracking-widest hover:bg-primary-50 hover:text-primary-600 transition-all">Tudo</button>
                            </div>
                            
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <div>
                                    <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1 ml-1">Início</label>
                                    <input type="date" id="caixa-report-start" value="${defaultStart}" onchange="filterCaixaReport()" class="w-full p-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-xl outline-none text-xs font-bold">
                                </div>
                                <div>
                                    <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1 ml-1">Fim</label>
                                    <input type="date" id="caixa-report-end" value="${defaultEnd}" onchange="filterCaixaReport()" class="w-full p-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-xl outline-none text-xs font-bold">
                                </div>
                                <div>
                                    <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1 ml-1">Tipo</label>
                                    <select id="caixa-report-type" onchange="filterCaixaReport()" class="w-full p-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-xl outline-none text-xs font-bold">
                                        <option value="all">Todas as Movimentações</option>
                                        <option value="entrada">Apenas Entradas</option>
                                        <option value="saida">Apenas Saídas</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div id="caixa-report-summary" class="grid grid-cols-3 gap-3">
                            <!-- Preenchido via filterCaixaReport() -->
                        </div>

                        <div class="overflow-x-auto bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700">
                            <table class="w-full text-[11px] text-left">
                                <thead class="bg-slate-50 dark:bg-slate-700/50 text-slate-500">
                                    <tr>
                                        <th class="px-4 py-3 font-black uppercase tracking-widest">Data</th>
                                        <th class="px-4 py-3 font-black uppercase tracking-widest">Descrição / Categoria</th>
                                        <th class="px-4 py-3 text-right font-black uppercase tracking-widest">Valor</th>
                                    </tr>
                                </thead>
                                <tbody id="caixa-report-table-body" class="divide-y divide-slate-50 dark:divide-slate-700">
                                    <!-- Preenchido via filterCaixaReport() -->
                                </tbody>
                            </table>
                        </div>
                        
                        <div id="caixa-report-load-more-container" class="flex justify-center gap-2 pt-2">
                            <button id="btn-caixa-load-more" onclick="loadMoreCaixaReport()" class="px-6 py-2.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-black text-[10px] uppercase tracking-widest rounded-xl hover:bg-slate-200 transition-all flex items-center gap-2">
                                <i data-lucide="plus-circle" class="w-4 h-4"></i> Carregar Mais
                            </button>
                            <button id="btn-caixa-load-all" onclick="loadAllCaixaReport()" class="px-6 py-2.5 bg-primary-50 dark:bg-primary-900/20 text-primary-600 font-black text-[10px] uppercase tracking-widest rounded-xl hover:bg-primary-100 transition-all flex items-center gap-2">
                                <i data-lucide="eye" class="w-4 h-4"></i> Ver Tudo
                            </button>
                        </div>
                    </div>
                `;

                // Funções globais para o relatório de caixa
                window.caixaReportLimit = 20;
                window.caixaReportFilteredData = [];

                window.setCaixaReportPreset = (preset) => {
                    const now = new Date();
                    const today = localDate(now);
                    let start = '';
                    let end = today;

                    if (preset === 'last_7') {
                        const d = new Date(now);
                        d.setDate(d.getDate() - 7);
                        start = localDate(d);
                    } else if (preset === 'last_30') {
                        const d = new Date(now);
                        d.setDate(d.getDate() - 30);
                        start = localDate(d);
                    } else if (preset === 'this_month') {
                        start = localDate(now).slice(0, 7) + '-01';
                    } else if (preset === 'all') {
                        start = '';
                        end = '';
                    }

                    document.getElementById('caixa-report-start').value = start;
                    document.getElementById('caixa-report-end').value = end;
                    
                    // Atualiza estilo dos botões
                    const buttons = document.querySelectorAll('[onclick^="setCaixaReportPreset"]');
                    buttons.forEach(btn => {
                        btn.classList.remove('bg-primary-600', 'text-white', 'shadow-sm');
                        btn.classList.add('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300');
                    });
                    event.currentTarget.classList.remove('bg-white', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300');
                    event.currentTarget.classList.add('bg-primary-600', 'text-white', 'shadow-sm');

                    window.filterCaixaReport();
                };

                window.filterCaixaReport = () => {
                    const start = document.getElementById('caixa-report-start').value;
                    const end = document.getElementById('caixa-report-end').value;
                    const type = document.getElementById('caixa-report-type').value;
                    
                    window.caixaReportLimit = 20;
                    
                    window.caixaReportFilteredData = appState.transactions.filter(t => {
                        const matchesStart = !start || t.date >= start;
                        const matchesEnd = !end || t.date <= end;
                        const matchesType = type === 'all' || t.type === type;
                        return matchesStart && matchesEnd && matchesType;
                    }).reverse();

                    // Atualiza Resumo
                    const totalIn = window.caixaReportFilteredData.filter(t => t.type === 'entrada').reduce((acc, t) => acc + t.amount, 0);
                    const totalOut = window.caixaReportFilteredData.filter(t => t.type === 'saida').reduce((acc, t) => acc + t.amount, 0);
                    
                    document.getElementById('caixa-report-summary').innerHTML = `
                        <div class="p-3 bg-green-50 dark:bg-green-900/10 border border-green-100 dark:border-green-800/30 rounded-xl">
                            <p class="text-[8px] font-black text-green-600 uppercase tracking-widest mb-0.5">Entradas</p>
                            <p class="text-xs font-black text-green-600">${formatCurrency(totalIn)}</p>
                        </div>
                        <div class="p-3 bg-red-50 dark:bg-red-900/10 border border-red-100 dark:border-red-800/30 rounded-xl">
                            <p class="text-[8px] font-black text-red-600 uppercase tracking-widest mb-0.5">Saídas</p>
                            <p class="text-xs font-black text-red-600">${formatCurrency(totalOut)}</p>
                        </div>
                        <div class="p-3 bg-primary-50 dark:bg-primary-900/10 border border-primary-100 dark:border-primary-800/30 rounded-xl">
                            <p class="text-[8px] font-black text-primary-600 uppercase tracking-widest mb-0.5">Saldo</p>
                            <p class="text-xs font-black text-primary-600">${formatCurrency(totalIn - totalOut)}</p>
                        </div>
                    `;

                    window.renderCaixaReportRows();
                };

                window.renderCaixaReportRows = () => {
                    const dataToShow = window.caixaReportFilteredData.slice(0, window.caixaReportLimit);
                    const container = document.getElementById('caixa-report-table-body');
                    const loadMoreBtn = document.getElementById('caixa-report-load-more-container');
                    
                    if (!container) return;

                    container.innerHTML = dataToShow.map(t => `
                        <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors">
                            <td class="px-4 py-3 font-medium text-slate-500">${formatDate(t.date)}</td>
                            <td class="px-4 py-3">
                                <div class="font-bold text-slate-900 dark:text-white uppercase truncate max-w-[200px]">${escapeHtml(t.description)}</div>

        async function refreshCloudSafely() {
            if (syncRunning) { showToast('A sincronização já está em andamento.', 'warning'); return; }
            if (pendingCloudSave) { await syncLocalChanges(); renderConfig(); return; }
            try {
                const doc = await db.collection('appData').doc(dbDocName).get({source:'server'});
                if (!doc.exists) throw new Error('Nenhum dado disponível na nuvem. Os dados locais foram mantidos.');
                const next = validateBackup(doc.data(), createEmptyState());
                preserveLocalBackup();
                localStorage.setItem(dataStorageKey, JSON.stringify(next));
                appState = next; cloudBaseline = canonical(doc.data()); cloudSyncEnabled = true; remoteRefreshPending = false;
                renderConfig(); showToast('Dados atualizados.');
            } catch(e) { showToast(e.message || 'Não foi possível acessar a nuvem.', 'error'); }
        }
        async function updateAppVersion() {
            if (pendingCloudSave) { showToast('Sincronize ou exporte um backup antes de atualizar.', 'error'); return; }
            try { const registration = await navigator.serviceWorker?.getRegistration(); if (registration) await registration.update(); location.reload(); }
            catch(e) { showToast('Não foi possível verificar a atualização. Confira a conexão.', 'error'); }
        }
        function openLocalBackups() {
            let backups=[]; try {backups=JSON.parse(localStorage.getItem(dataStorageKey+'-backups') || '[]');} catch(_) {}
            openModal('<div class="p-5 space-y-3 dark:text-white"><h3 class="font-bold text-lg">Backups deste aparelho</h3><p class="text-sm">Até cinco cópias diárias anteriores às alterações. Baixe a cópia para conferir ou restaurar pela opção Importar backup.</p>'+backups.map((b,i)=>'<button onclick="downloadLocalBackup('+i+')" class="w-full p-3 border rounded-xl">Baixar cópia de '+escapeHtml(b.day)+'</button>').join('')+(!backups.length?'<p>Nenhuma cópia automática disponível ainda.</p>':'')+'<button onclick="closeModal()" class="w-full p-3 border rounded-xl">Voltar</button></div>');
        }
        function downloadLocalBackup(index) {
            const backups=JSON.parse(localStorage.getItem(dataStorageKey+'-backups') || '[]');const backup=backups[index];if(!backup)return;
            const url=URL.createObjectURL(new Blob([backup.data],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='fabrica-backup-'+backup.day+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
        }

        function startManualMigration() {
            if (!firebaseReady || !db) {
                showToast("Firebase não está conectado.", "error");
                return;
            }

            const confirmMsg = `Você está prestes a subir os dados locais para o ambiente ${currentEnv.toUpperCase()}. A operação só continuará se este ambiente estiver vazio na nuvem. Tem certeza?`;
            
            if (confirm(confirmMsg)) {
                showToast("Iniciando migração...");
                
                const migrationSnapshot = JSON.parse(JSON.stringify(appState));
                db.runTransaction(async transaction => {
                    const ref = db.collection('appData').doc(dbDocName);
                    const remote = await transaction.get(ref);
                    if (remote.exists) throw new Error('O ambiente já contém dados. A migração foi cancelada para preservá-los.');
                    transaction.set(ref, migrationSnapshot);
                })
                    .then(() => {
                        cloudSyncEnabled = true;
                        cloudBaseline = canonical(migrationSnapshot);
                        pendingCloudSave = canonical(appState) !== cloudBaseline;
                        if (pendingCloudSave) saveData();
                        else localStorage.removeItem(pendingKey);
                        setSaveStatus('Salvo neste aparelho e na nuvem.');
                        showToast("Migração concluída com sucesso!");
                        renderConfig();
                    })
                    .catch(err => {
                        console.error("Erro na migração:", err);
                        showToast(err.message || "Falha na migração. Verifique sua conexão.", "error");
                    });
            }
        }

                const fixedInCat = appState.fixedAccounts.filter(a => a.category === catName);
                if (transactionsInCat.length > 0 || fixedInCat.length > 0) {

                renderConfig();
                showToast('Categoria excluída!');

        function importData(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            if (file.size > 10 * 1024 * 1024) {
                showToast('O backup excede o tamanho permitido de 10 MB.', 'error');
                input.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const imported = validateBackup(JSON.parse(e.target.result), createEmptyState());
                    if (!confirm('Restaurar este backup substituirá os dados atuais deste ambiente. Uma cópia local será preservada. Continuar?')) return;
                    localStorage.setItem('financeProBeforeImport-' + currentEnv, JSON.stringify(appState));
                    appState = imported;
                    await saveData();
                    renderContent();
                    updateLoginHint();
                } catch (err) {
                    showToast('Backup não importado: ' + err.message, 'error');
                } finally { input.value = ''; }
            };
            reader.onerror = () => { showToast('Não foi possível ler o backup.', 'error'); input.value = ''; };
            reader.readAsText(file);
        }

        async function clearData() {
            const ok = confirm('ATENÇÃO: Isso vai ZERAR o app permanentemente. Se o sincronismo estiver ativo, os dados também serão apagados da nuvem. Continuar?');
            if (!ok) return;

            // Se o sincronismo estiver ativo, apaga também do Firebase
            if (firebaseReady && db && cloudSyncEnabled) {
                try {
                    await db.collection('appData').doc(dbDocName).delete();
                    console.log("Dados apagados da nuvem.");
                } catch (err) {
                    console.error("Erro ao apagar dados da nuvem:", err);
                    alert("Erro ao apagar dados da nuvem. O app será zerado apenas localmente.");
                }
            }

            try {
                localStorage.removeItem(dataStorageKey);
                localStorage.removeItem('financeProUser');
                localStorage.removeItem(pendingKey);
            } catch (_) {
            }

            try {
                localStorage.setItem(dataStorageKey, JSON.stringify(createEmptyState()));
            } catch (_) {
            }

            try {
                if ('caches' in window) {
                    const cacheKeys = await caches.keys();
                    await Promise.all(cacheKeys.map((k) => caches.delete(k)));
                }
            } catch (_) {
            }

            try {
                if ('serviceWorker' in navigator) {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(regs.map((r) => r.unregister()));
                }
            } catch (_) {
            }

            window.location.replace(window.location.pathname + '?env=' + encodeURIComponent(currentEnv) + '&r=' + Date.now());
        }

        // --- APP INITIALIZATION ---
        function applyDeferredCloudData() {
            if (!currentUser || !deferredCloudData || pendingCloudSave || syncRunning || currentCart.length || !modalBackdrop.classList.contains('hidden') || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')) return;
            const next = deferredCloudData;
            try {
                localStorage.setItem(dataStorageKey, JSON.stringify(next));
                appState = next; cloudBaseline = canonical(next); deferredCloudData = null; remoteRefreshPending = false;
                renderContent();
            } catch (_) { setSaveStatus('Não foi possível guardar os dados atualizados neste aparelho.', true); }
        }
        setInterval(applyDeferredCloudData, 1500);
        let remoteRefreshPending = false;
        function safeRemoteRender() {
            const modalOpen = !modalBackdrop.classList.contains('hidden');
            const editing = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
            if (modalOpen || editing || (typeof currentCart !== 'undefined' && currentCart.length)) {
                remoteRefreshPending = true;
                return;
            }
            remoteRefreshPending = false;
            renderContent();
        }
        function initApp() {
            if (!currentUser || isInitializing) return;
            isInitializing = true;

            // --- Lógica do Firebase com Ambientes ---
            if (firebaseReady && db) {
                // Ouvinte em tempo real no documento do ambiente correto
                if (cloudUnsubscribe) cloudUnsubscribe();
                cloudUnsubscribe = db.collection('appData').doc(dbDocName).onSnapshot({ includeMetadataChanges: true }, (doc) => {
                    if (doc.metadata.hasPendingWrites || doc.metadata.fromCache) return;
                    if (doc.exists) {
                        const cloudData = doc.data();
                        if ((!modalBackdrop.classList.contains('hidden') || currentCart.length || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')) && canonical(cloudData) !== cloudBaseline && !pendingCloudSave && !syncRunning) {
                            remoteRefreshPending = true;
                            deferredCloudData = cloudData;
                            setSaveStatus('Há novidades em outro aparelho. Conclua ou feche o formulário e use Atualizar dados em Configurações.');
                            return;
                        }
                        // Se detectarmos dados na nuvem, ativamos o sincronismo
                        cloudSyncEnabled = true;
                        
                        if (pendingCloudSave || syncRunning) {
                            if (!syncRunning) syncLocalChanges();
                            return;
                        }
                        deferredCloudData = null;
                        cloudBaseline = canonical(cloudData);
                        // Atualiza o estado local com os dados da nuvem
                        appState = cloudData;
                        if (appState.config) delete appState.config.loginPassword;
                        try {
                            localStorage.setItem(dataStorageKey, JSON.stringify(appState));
                        } catch (_) {
                            setSaveStatus('Dados carregados da nuvem, mas não foi possível guardar uma cópia neste aparelho.', true);
                        }
                        if (currentUser) {
                            safeRemoteRender();
                            // Tenta reconstruir apenas se necessário e após a primeira renderização
                            // Monthly reporting does not rewrite legacy cycle history.
                        }
                    } else {
                        // A transação cria o primeiro documento apenas se ele continuar ausente.
                        cloudSyncEnabled = true;
                        if (!pendingCloudSave) cloudBaseline = null;
                        if (pendingCloudSave && !syncRunning) syncLocalChanges();
                        console.log(`Ambiente ${currentEnv} aguardando migração ou novos dados.`);
                    }
                }, (err) => {
                    setSaveStatus("Não foi possível acessar a nuvem. Verifique a conexão e as permissões.", true);
                    console.error("Erro no ouvinte do Firebase:", err);
                });
            }

            // Migração legada: Popular sale.fee a partir das transações se estiver faltando
            if (Array.isArray(appState.sales)) {
                appState.sales.forEach(s => {
                    if (s.status === 'completed' && (s.fee === undefined || s.fee === 0)) {
                        const fees = appState.transactions
                            .filter(t => t.saleId === s.id && t.type === 'saida' && t.category === 'Taxas de Cartão')
                            .reduce((acc, t) => acc + t.amount, 0);
                        if (fees > 0) {
                            s.fee = fees;
                        } else if (s.fee === undefined) {
                            s.fee = 0;
                        }
                    }
                });
            }
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            
            // Update UI with user info
            document.getElementById('user-display-name').innerText = currentUser.name;
            document.getElementById('user-display-role').innerText = currentUser.role;
            document.getElementById('user-avatar').src = currentUser.avatar;
            
            // Reconstrução em segundo plano para não travar o carregamento inicial
            // Legacy cycle history is preserved without automatic reconstruction.

            // Apply theme
            const savedTheme = localStorage.getItem('financeProTheme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('sun-icon').classList.remove('hidden');
                document.getElementById('moon-icon').classList.add('hidden');
            }

            switchTab('dashboard');
            if (isPC && currentEnv === 'prod') {
                showToast("⚠️ ATENÇÃO: Modo PRODUÇÃO no PC!", "error");
            }
            try {
                lucide.createIcons();
            } catch (_) {
            }
        }

        function renderContent() {
            const saveBanner = document.getElementById('save-status');
            if (saveBanner) saveBanner.style.display = currentTab === 'dashboard' ? 'none' : '';
            const contentArea = document.getElementById('content-area');
            contentArea.scrollTo(0,0);
            
            switch(currentTab) {
                case 'dashboard': renderDashboard(); break;
                case 'overview': renderOverview(); break;
                case 'producao': renderProducao(); break;
                case 'estoque': renderEstoque(); break;
                case 'caixa': renderCaixa(); break;
                case 'contas': renderContasFixas(); break;
                case 'funcionarios': renderFuncionarios(); break;
                case 'clientes': renderClientes(); break;
                case 'vendas': renderVendas(); break;
                case 'relatorios': renderRelatorios(); break;
                case 'metas': renderMetas(); break;
                case 'config': renderConfig(); break;
                case 'investimentos': renderInvestments(); break;
            }
        }

        window.onload = () => {
            try { lucide.createIcons(); } catch (_) {}
            if (auth) auth.onAuthStateChanged(handleAuthState);
            else setLoginError('Não foi possível iniciar o acesso seguro. Verifique sua conexão e recarregue.');
        };

        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js');
            });
        }

    </script>
