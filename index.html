        async function recoverCloudData() {
            if (syncRunning || !currentUser) return;
            if (!confirm('Carregar a versão da nuvem? Uma cópia dos dados atuais será baixada primeiro para você conferir os lançamentos que ainda não foram sincronizados.')) return;
            try {
                const remote = await db.collection('appData').doc(dbDocName).get({ source: 'server' });
                if (!remote.exists) throw new Error('Não há dados na nuvem para recuperar.');
                exportData();
                localStorage.setItem('financeProBeforeRecovery-' + currentEnv, JSON.stringify(appState));
                const cloudData = remote.data();
                const defaults = createEmptyState();
                const recovered = { ...defaults, ...cloudData, config: { ...defaults.config, ...cloudData.config } };
                delete recovered.config.loginPassword;
                localStorage.setItem(dataStorageKey, JSON.stringify(recovered));
                localStorage.removeItem(pendingKey);
                appState = recovered;
                cloudBaseline = canonical(cloudData);
                pendingCloudSave = false;
                cloudSyncEnabled = true;
                renderContent();
                setSaveStatus('Dados da nuvem carregados. Confira no backup os lançamentos locais pendentes.');
            } catch (err) { showToast('Não foi possível recuperar: ' + err.message, 'error'); }
        }

        function preserveLocalBackup() {
            try {
                const previous = localStorage.getItem(dataStorageKey);
                if (!previous) return;
                const key = dataStorageKey + '-backups';
                const backups = JSON.parse(localStorage.getItem(key) || '[]');
                const day = localDate();
                if (backups.some(b => b.day === day)) return;
                backups.unshift({ day, data: previous });
                localStorage.setItem(key, JSON.stringify(backups.slice(0, 5)));
            } catch (_) { /* The main save reports quota failures independently. */ }
        }

        let saveOutcome = null;
        function saveData() {
            saveOutcome = 'saving';
            if (appState.config) delete appState.config.loginPassword;
            try {
                // Persist the pending marker first: a reload must not silently discard local edits.
                localStorage.setItem(pendingKey, JSON.stringify({ baseline: cloudBaseline ?? null }));
                preserveLocalBackup();
                localStorage.setItem(dataStorageKey, JSON.stringify(appState));
                pendingCloudSave = true;
                saveOutcome = 'local';
            } catch (err) {
                pendingCloudSave = true;
                saveOutcome = 'failed';
                setSaveStatus('Não foi possível salvar neste aparelho. Exporte um backup antes de fechar o app.', true);
                return Promise.resolve(false);
            }
            if (!firebaseReady || !db || !cloudSyncEnabled) {
                return Promise.resolve(false);
            }
            return syncLocalChanges();
        }

        function syncLocalChanges() {
            if (syncRunning) return syncPromise;
            syncRunning = true;
            syncPromise = (async () => {
                try {
                    while (pendingCloudSave) {
                        if (cloudBaseline === undefined) throw new Error('Aguarde a leitura da nuvem antes de sincronizar.');
                        const snapshot = JSON.parse(JSON.stringify(appState));
                        const expected = cloudBaseline;
                        let committed = snapshot;
                        const ref = db.collection('appData').doc(dbDocName);
                        setSaveStatus('Salvo neste aparelho. Sincronizando...');
                        await db.runTransaction(async transaction => {
                            const remote = await transaction.get(ref);
                            const actual = remote.exists ? canonical(remote.data()) : null;
                            committed = snapshot;
                            if (actual === canonical(snapshot)) return;
                            if (actual !== expected) {
                                if (!expected || !remote.exists) throw new Error('Há alterações em outro aparelho. Seus dados locais foram preservados. Exporte um backup para conciliar as versões.');
                                committed = mergeStates(JSON.parse(expected), snapshot, remote.data());
                            }
                            transaction.set(ref, committed);
                        });
                        const reconciled = mergeStates(snapshot, appState, committed);
                        appState = reconciled;
                        localStorage.setItem(dataStorageKey, JSON.stringify(appState));
                        cloudBaseline = canonical(committed);
                        pendingCloudSave = canonical(appState) !== cloudBaseline;
                        if (pendingCloudSave) localStorage.setItem(pendingKey, JSON.stringify({ baseline: cloudBaseline }));
                        else localStorage.removeItem(pendingKey);
                    }
                    if (typeof deferredCloudData !== 'undefined') deferredCloudData = null;
                    saveOutcome = 'synced';
                    setSaveStatus('Salvo neste aparelho e na nuvem.');
                    if (typeof safeRemoteRender === 'function') safeRemoteRender();
                    return true;
                } catch (err) {
                    setSaveStatus('Salvo apenas neste aparelho. ' + (err.message || 'Verifique sua conexão.'), true);
                    return false;
                } finally { syncRunning = false; }
            })();
            return syncPromise;
        }

        window.addEventListener('online', () => {

        function saleItemCost(item) {
            if (Number.isFinite(item.unitCost) && item.unitCost >= 0) return item.unitCost;
            // Legacy sales have no historical cost; retain the previous estimate.
            const product = appState.inventory.find(p => p.id === item.productId);
            return Number.isFinite(product?.costPrice) && product.costPrice >= 0 ? product.costPrice : 0;

                return { ...item, unitCost: product.costPrice };
            });
        }

        function calculateBreakEvenData(resetDateStr, endDateStr = null) {
            const salariesCosts = (appState.employees || []).reduce((acc, emp) => acc + (emp.salary || 0), 0);
            const baseFixedCosts = (appState.fixedAccounts || []).reduce((acc, a) => acc + (a.amount || 0), 0) + salariesCosts;
            
            const monthlySales = (appState.sales || []).filter(s => {
                const isAfterStart = s.date >= resetDateStr;
                const isBeforeEnd = s.date <= (endDateStr || getBreakEvenConfig().endDateStr);
                return isAfterStart && isBeforeEnd && s.status === 'completed';
            });
            
            const totalRevenue = monthlySales.reduce((acc, s) => acc + (s.total || 0), 0);
            
            const totalVariableCosts = monthlySales.reduce((acc, s) => {
                const materialsCost = (s.items || []).reduce((itemAcc, item) => {
                    const product = (appState.inventory || []).find(p => p.id === item.productId);
                    return itemAcc + saleItemCost(item) * (item.qty || 0);
                }, 0);
                return acc + materialsCost + (s.deliveryHelperCostTotal || 0) + (s.fee || 0);
            }, 0);

            const contributionMargin = totalRevenue - totalVariableCosts;
            const contributionMarginPct = totalRevenue > 0 ? (contributionMargin / totalRevenue) : 0.35;
            const breakEvenValue = contributionMarginPct > 0 ? (baseFixedCosts / contributionMarginPct) : baseFixedCosts;
            const progress = breakEvenValue > 0 ? Math.min(100, (totalRevenue / breakEvenValue) * 100) : 100;
            
            return {
                baseFixedCosts,
                totalRevenue,
                breakEvenValue,
                progress,
                isReached: totalRevenue >= breakEvenValue,
                contributionMarginPct
            };
        }

        function reconstructPastCycles() {
            try {
                if (appState.breakEvenHistory && appState.breakEvenHistory.length > 0) return;
                
                const { resetDateStr } = getBreakEvenConfig();
                if (!resetDateStr) return;

                // Encontrar a data mais antiga de venda ou transação
                let allDates = [
                    ...(appState.sales || []).map(s => s.date),
                    ...(appState.transactions || []).map(t => t.date)
                ].filter(d => typeof d === 'string').sort();

                if (allDates.length === 0) return;
                
                let earliestDateStr = allDates[0];
                
                // Garantir formato YYYY-MM-DD para o Date constructor
                const [y, m, d] = resetDateStr.split('-').map(Number);
                let currentStart = new Date(y, m - 1, d);
                
                let history = [];
                let iterations = 0;
                const maxIterations = 12;

                while (iterations < maxIterations) {
                    let cycleEnd = new Date(currentStart);
                    cycleEnd.setDate(cycleEnd.getDate() - 1);
                    
                    if (isNaN(cycleEnd.getTime())) break;
                    
                    let cycleEndStr = cycleEnd.getFullYear() + '-' + String(cycleEnd.getMonth() + 1).padStart(2, '0') + '-' + String(cycleEnd.getDate()).padStart(2, '0');

                    let cycleStart = new Date(cycleEnd);
                    cycleStart.setDate(cycleStart.getDate() - 29);
                    
                    if (isNaN(cycleStart.getTime())) break;
                    
                    let cycleStartStr = cycleStart.getFullYear() + '-' + String(cycleStart.getMonth() + 1).padStart(2, '0') + '-' + String(cycleStart.getDate()).padStart(2, '0');

                    if (cycleEndStr < earliestDateStr) break;

                    const data = calculateBreakEvenData(cycleStartStr, cycleEndStr);
                    
                    if (data.totalRevenue > 0 || cycleEndStr >= earliestDateStr) {
                    const salesGoal = appState.config.salesGoal || 100000;
                    history.push({
                        id: Date.now() - (iterations * 1000),
                        startDate: cycleStartStr,
                        endDate: cycleEndStr,
                        revenue: data.totalRevenue,
                        target: data.breakEvenValue,
                        salesGoal: salesGoal,
                        reached: data.isReached,
                        salesGoalReached: data.totalRevenue >= salesGoal,
                        progress: data.progress
                    });
                }

                    currentStart = cycleStart;
                    iterations++;
                }

                if (history.length > 0) {
                    appState.breakEvenHistory = history;
                    saveData();
                }
            } catch (err) {
                console.error("Erro ao reconstruir ciclos:", err);
            }
        }

        function archiveCurrentCycle() {
            // Não usamos getBreakEvenConfig aqui para evitar recursão
            const resetDateStr = appState.config.breakEvenResetDate;
            if (!resetDateStr) return;

            const [y1, m1, d1] = resetDateStr.split('-').map(Number);
            const date1 = new Date(y1, m1 - 1, d1);
            const endObj = new Date(date1);
            endObj.setDate(date1.getDate() + 29);
            const endDateStr = endObj.getFullYear() + '-' + String(endObj.getMonth() + 1).padStart(2, '0') + '-' + String(endObj.getDate()).padStart(2, '0');

            const data = calculateBreakEvenData(resetDateStr);
            
            const cycle = {
                id: Date.now(),
                startDate: resetDateStr,
                endDate: endDateStr,
                revenue: data.totalRevenue,
                target: data.breakEvenValue,
                salesGoal: appState.config.salesGoal || 0,
                reached: data.isReached,
                salesGoalReached: data.totalRevenue >= (appState.config.salesGoal || 0),
                progress: data.progress
            };
            
            if (!appState.breakEvenHistory) appState.breakEvenHistory = [];
            
            // Evitar duplicatas (se o usuário clicar em resetar duas vezes no mesmo dia por exemplo)
            const isDuplicate = appState.breakEvenHistory.some(h => h.startDate === cycle.startDate && h.endDate === cycle.endDate);
            if (isDuplicate) return;

            appState.breakEvenHistory.unshift(cycle);
            // Manter apenas os últimos 12 ciclos
            if (appState.breakEvenHistory.length > 12) {
                appState.breakEvenHistory = appState.breakEvenHistory.slice(0, 12);
            }
        }

         * Calcula o mês selecionado sem modificar o histórico.

        let selectedReportMonth = '';
        function getBreakEvenConfig() {
            const now = new Date();
            const month = /^\d{4}-(0[1-9]|1[0-2])$/.test(selectedReportMonth) ? selectedReportMonth : localDate(now).slice(0, 7);
            const [year, number] = month.split('-').map(Number);
            const daysInMonth = new Date(year, number, 0).getDate();
            const todayStr = localDate(now);
            const daysElapsed = month < todayStr.slice(0,7) ? daysInMonth : month > todayStr.slice(0,7) ? 0 : now.getDate();
            return { resetDateStr: month + '-01', endDateStr: month + '-' + daysInMonth, daysElapsed, daysInMonth, todayStr };

        async function handleAuthState(user) {
            if (!user) { resetSessionUI(); setLoginBusy(false); return; }
            setLoginBusy(true, 'Carregando os dados da fábrica...');
            try {
                // Rules enforce the permitted owner on the server before showing cached data.
                const firstSnapshot = await db.collection('appData').doc(dbDocName).get({ source: 'server' });
                if (!auth.currentUser || auth.currentUser.uid !== user.uid) return;
                // Hydrate before initApp: its startup routines must never save demo data
                // or create a pending edit before the cloud baseline is known.
                if (!pendingCloudSave) {
                    const remoteState = firstSnapshot.exists ? firstSnapshot.data() : null;
                    cloudBaseline = remoteState ? canonical(remoteState) : null;
                    cloudSyncEnabled = true;
                    const defaults = createEmptyState();
                    const localCopy = localStorage.getItem?.(dataStorageKey);
                    preserveLocalBackup();
                    appState = remoteState
                        ? { ...defaults, ...remoteState, config: { ...defaults.config, ...remoteState.config } }
                        : localCopy ? JSON.parse(localCopy) : defaults;
                    if (!remoteState && localCopy) { pendingCloudSave = true; localStorage.setItem(pendingKey, JSON.stringify({baseline:null})); }
                    delete appState.config.loginPassword;
                    try { localStorage.setItem(dataStorageKey, JSON.stringify(appState)); } catch (_) {}
                }
                cloudSyncEnabled = true;
                currentUser = { uid: user.uid, email: user.email, name: user.displayName || 'Admin', role: 'Administrador', avatar: 'app-icon.svg' };
                initApp();
            } catch (err) {
                resetSessionUI();
                await auth.signOut();
                setLoginError(err.code === 'permission-denied'
                    ? 'Esta conta ainda não está autorizada. Confira a configuração de acesso no Firebase.'
                    : 'Não foi possível verificar seu acesso. Confira a conexão e tente novamente.');
            } finally { setLoginBusy(false); }
        }

            (appState.production || []).filter(p => p.date >= resetDateStr).forEach(p => {
                const name = p.productName || 'Produto';
                monthlyProductionMap.set(name, (monthlyProductionMap.get(name) || 0) + (p.qty || 0));
            });
            const monthlyProduction = Array.from(monthlyProductionMap.entries())
                .map(([name, qty]) => ({ name, qty }))
                .sort((a, b) => b.qty - a.qty);

            (appState.sales || []).filter(s => s.status !== 'cancelled' && saleDeliveryState(s) !== 'delivered').forEach(sale => {
                (sale.items || []).forEach(item => {
                    if (!item.productId) return;
                    if (!pcpNeeds[item.productId]) {
                        pcpNeeds[item.productId] = {
                            name: item.name || 'Produto',
                            needed: 0,
                            stock: 0

                        <div id="recipe-preview" class="p-5 bg-primary-50 dark:bg-primary-900/10 rounded-3xl border border-primary-100 dark:border-primary-900/30 hidden">
                            <h5 class="text-[10px] font-black text-primary-700 dark:text-primary-300 uppercase tracking-widest mb-3 flex items-center gap-2">

                            </h5>

                        </div>

                        <div class="flex flex-col sm:flex-row justify-end gap-3 pt-4 border-t border-slate-100 dark:border-slate-700">
                            <button type="button" onclick="closeModal()" class="w-full sm:w-auto px-6 py-4 sm:py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 font-black text-xs uppercase tracking-widest hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">Cancelar</button>

                </div>
            `;
            openModal(html);

            const select = document.getElementById('prod-product');
            const qtyInput = document.getElementById('prod-qty');
            
            const updatePreview = () => {
                const pId = parseInt(select.value);
                const qty = parseInt(qtyInput.value) || 0;
                const product = appState.inventory.find(p => p.id === pId);
                const previewDiv = document.getElementById('recipe-preview');
                const list = document.getElementById('recipe-list');

                if (product && product.recipe && qty > 0) {
                    previewDiv.classList.remove('hidden');
                    list.innerHTML = product.recipe.map(item => {
                        const material = appState.inventory.find(m => m.id === item.productId);
                        const totalNeeded = item.qty * qty;
                        const isShort = material.stock < totalNeeded;
                        return `
                            <li class="flex justify-between items-center ${isShort ? 'text-danger' : 'text-slate-600 dark:text-slate-400'}">
                                <span class="text-xs font-bold uppercase tracking-tight">${escapeHtml(material.name)}</span>
                                <span class="text-xs font-black ${isShort ? 'text-danger' : 'text-slate-900 dark:text-white'}">
                                    ${totalNeeded.toFixed(2)} ${material.unit}
                                    ${isShort ? '<br><span class="text-[8px] uppercase tracking-tighter">Estoque Insuficiente!</span>' : ''}
                                </span>
                            </li>
                        `;
                    }).join('');
                } else {
                    previewDiv.classList.add('hidden');
                }
            };

            select.onchange = updatePreview;
            qtyInput.oninput = updatePreview;
            
            // Run preview immediately if pre-selected
            if (preSelectedId && preSelectedQty) {
                updatePreview();
            }

            document.getElementById('production-form').onsubmit = (e) => {
                e.preventDefault();
                const pId = parseInt(select.value);
                const qty = parseInt(qtyInput.value);
                const date = document.getElementById('prod-date').value;
                const product = appState.inventory.find(p => p.id === pId);

                if (!product) {
                    showToast('Selecione um produto.', 'error');
                    return;
                }

                if (!Number.isInteger(qty) || qty <= 0 || !Array.isArray(product.recipe) || !product.recipe.length) {
                    showToast('Informe uma quantidade válida e cadastre a receita do produto.', 'error');
                    return;
                }
                if (product.recipe.some(item => !appState.inventory.some(m => m.id === item.productId) || !Number.isFinite(item.qty) || item.qty <= 0)) {
                    showToast('A receita contém um material ausente ou uma quantidade inválida.', 'error');
                    return;
                }

                // Check stock for all materials first
                let stockOk = true;
                product.recipe.forEach(item => {
                    const material = appState.inventory.find(m => m.id === item.productId);
                    if (material.stock < (item.qty * qty)) stockOk = false;
                });

                if (!stockOk) {
                    showToast('Estoque de matéria-prima insuficiente!', 'error');
                    return;
                }

                // 1. Record materials used for history
                const usedMaterials = product.recipe.map(item => {
                    const material = appState.inventory.find(m => m.id === item.productId);
                    const totalUsed = item.qty * qty;
                    material.stock -= totalUsed; // 2. Deduct from stock
                    return { productId: material.id, name: material.name, qty: totalUsed };
                });

                // 3. Add to finished product stock
                product.stock += qty;

                // 4. Save Production Record
                appState.production.push({
                    id: Date.now(),
                    productId: pId,
                    productName: product.name,
                    qty: qty,
                    date: date,
                    materials: usedMaterials
                });

                saveData();
                closeModal();
                renderProducao();
                showToast('Produção registrada com sucesso!');
            };
            
            try {
                lucide.createIcons();
            } catch (_) {}
        }

        function deleteProduction(id) {
            const record = appState.production.find(p => p.id === id);
            if (!record) return;
            const product = appState.inventory.find(p => p.id === record.productId);
            const materials = record.materials;
            if (!product || !Number.isFinite(record.qty) || record.qty <= 0 || !Array.isArray(materials) || !materials.length || materials.some(m => !Number.isFinite(m.qty) || m.qty <= 0 || !appState.inventory.some(p => p.id === m.productId))) {
                showToast('Este registro não tem os dados necessários para um estorno seguro. Confira os produtos e materiais cadastrados.', 'error');
                return;
            }
            const deltas = new Map([[product.id, -record.qty]]);
            materials.forEach(m => deltas.set(m.productId, (deltas.get(m.productId) || 0) + m.qty));
            if ([...deltas].some(([key, delta]) => !Number.isFinite(appState.inventory.find(p => p.id === key).stock) || appState.inventory.find(p => p.id === key).stock + delta < 0)) {
                showToast('Não é possível estornar: parte dessa produção já foi vendida ou utilizada. Regularize o estoque primeiro.', 'error');
                return;
            }
            if (!confirm('Estornar esta produção? O produto acabado será descontado e os materiais usados serão devolvidos ao estoque.')) return;
            deltas.forEach((delta, key) => { appState.inventory.find(p => p.id === key).stock += delta; });
            if (!Array.isArray(appState.productionReversals)) appState.productionReversals = [];
            appState.productionReversals.push({ ...record, reversedAt: new Date().toISOString() });
            appState.production = appState.production.filter(p => p.id !== id);
            saveData();
            renderProducao();
            showToast('Produção estornada e estoque ajustado.');
        }

        function investmentSummary() {
            const records=appState.investmentRecords || [];
            const month=localDate().slice(0,7);
            return { balance: records.reduce((sum,r)=>sum+(r.type==='deposit'?r.amount:-r.amount),0), monthly:records.filter(r=>r.type==='deposit' && r.date.startsWith(month)).reduce((sum,r)=>sum+r.amount,0), goal:Number(appState.config.investmentMonthlyGoal)||0 };
        }
        function recordInvestment(type, amount, date, note) {
            if (!['deposit','withdrawal'].includes(type) || !Number.isFinite(amount) || amount<=0 || !/^\d{4}-\d{2}-\d{2}$/.test(date) || date>localDate()) throw new Error('Informe um valor positivo e uma data até hoje.');
            if (type==='withdrawal' && Math.round(amount*100)>Math.round(investmentSummary().balance*100)) throw new Error('O resgate não pode ultrapassar o saldo registrado.');
            if (!Array.isArray(appState.investmentRecords)) appState.investmentRecords=[];
            appState.investmentRecords.push({id:crypto.randomUUID(),type,amount:Math.round(amount*100)/100,date,note:note.trim()});
        }
        function renderInvestments() {
            const {balance,monthly,goal}=investmentSummary();
            const progress=goal>0?Math.min(100,monthly/goal*100):0;
            const records=[...(appState.investmentRecords || [])].reverse();
            document.getElementById('content-area').innerHTML=`<div class="max-w-3xl mx-auto space-y-4 dark:text-white">

        function switchDashboardTab(subTabId) {
            dashboardSubTab = subTabId;
            
            // 1. Atualizar visual dos botões de sub-aba sem recarregar o header
            const subNav = document.querySelector('.flex.gap-2.p-1.bg-slate-100.dark\\:bg-slate-800.rounded-2xl.mb-6');
            if (subNav) {
                const buttons = subNav.querySelectorAll('button');
                buttons.forEach(btn => {
                    const isGeral = btn.innerText.includes('Geral') && subTabId === 'geral';
                    const isFin = btn.innerText.includes('Finanças') && subTabId === 'financeiro';
                    const isAlert = btn.innerText.includes('Avisos') && subTabId === 'alertas';
                    
                    if (isGeral || isFin || isAlert) {
                        btn.className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition-all bg-white dark:bg-slate-700 shadow-sm text-primary-600 dark:text-white";
                    } else {
                        btn.className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition-all text-slate-500";
                    }
                });
            }

            // 2. Atualizar apenas o subconteúdo para evitar o "pisca"
            const subContent = document.getElementById('dashboard-subcontent');
            if (subContent) {
                subContent.innerHTML = renderDashboardSubTab();
                lucide.createIcons();
                if (dashboardSubTab === 'geral' || dashboardSubTab === 'financeiro') {
                    setTimeout(initDashboardCharts, 50);
                }
            } else {
                renderOverview();
            }
        }

        function initDashboardCharts() {
            const chartCashEl = document.getElementById('chart-cashflow');
            const chartPieEl = document.getElementById('chart-pie');
            
            if (dashboardSubTab === 'geral' && chartCashEl) {
                const ctxCash = chartCashEl.getContext('2d');
                
                // Agregação de dados reais dos últimos 6 meses
                const labels = [];
                const incomeData = [];
                const expenseData = [];
                
                const now = new Date();
                for (let i = 5; i >= 0; i--) {
                    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
                    const monthStr = localDate(d).slice(0, 7);
                    labels.push(d.toLocaleDateString('pt-BR', { month: 'short' }));
                    
                    const monthlyIn = appState.transactions
                        .filter(t => t.type === 'entrada' && t.date.startsWith(monthStr))
                        .reduce((acc, t) => acc + t.amount, 0);
                    
                    const monthlyOut = appState.transactions
                        .filter(t => t.type === 'saida' && t.date.startsWith(monthStr))
                        .reduce((acc, t) => acc + t.amount, 0);
                        
                    incomeData.push(monthlyIn);
                    expenseData.push(monthlyOut);
                }
                
                if (dashboardCharts.cash) dashboardCharts.cash.destroy();
                
                dashboardCharts.cash = new Chart(ctxCash, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Entradas',
                                data: incomeData,
                                borderColor: '#10b981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                fill: true,
                                tension: 0.4,
                                borderWidth: 3,
                                pointRadius: 4,
                                pointBackgroundColor: '#10b981'
                            },
                            {
                                label: 'Saídas',
                                data: expenseData,
                                borderColor: '#ef4444',
                                backgroundColor: 'rgba(239, 68, 68, 0.1)',
                                fill: true,
                                tension: 0.4,
                                borderWidth: 3,
                                pointRadius: 4,
                                pointBackgroundColor: '#ef4444'
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { 
                                beginAtZero: true, 
                                grid: { color: 'rgba(0,0,0,0.05)', drawBorder: false },
                                ticks: { callback: value => formatCurrency(value).split(',')[0] }
                            },
                            x: { grid: { display: false } }
                        }
                    }
                });
            }

            if (dashboardSubTab === 'financeiro' && chartPieEl) {
                const ctxPie = chartPieEl.getContext('2d');
                
                // Vendas por Produto (Quantidade acumulada)
                const currentMonth = localDate().slice(0, 7);
                const salesByProduct = {};
                
                appState.sales
                    .filter(s => s.date.startsWith(currentMonth))
                    .forEach(s => {
                        if (s.items && Array.isArray(s.items)) {
                            s.items.forEach(item => {
                                salesByProduct[item.name] = (salesByProduct[item.name] || 0) + item.qty;
                            });
                        }
                    });
                
                const pieLabels = Object.keys(salesByProduct);
                const pieData = Object.values(salesByProduct);
                
                if (dashboardCharts.pie) dashboardCharts.pie.destroy();

                dashboardCharts.pie = new Chart(ctxPie, {
                    type: 'doughnut',
                    data: {
                        labels: pieLabels.length > 0 ? pieLabels : ['Nenhuma venda'],
                        datasets: [{
                            data: pieData.length > 0 ? pieData : [1],
                            backgroundColor: ['#0ea5e9', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16', '#f97316'],
                            borderWidth: 2,
                            borderColor: document.documentElement.classList.contains('dark') ? '#1e293b' : '#fff',
                            hoverOffset: 15
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '70%',
                        plugins: { 
                            legend: { 
                                position: 'bottom',
                                labels: { 
                                    padding: 15,
                                    usePointStyle: true,
                                    font: { size: 10, weight: '700' },
                                    generateLabels: (chart) => {
                                        const data = chart.data;
                                        if (data.labels.length && data.datasets.length) {
                                            return data.labels.map((label, i) => {
                                                const value = data.datasets[0].data[i];
                                                return {
                                                    text: `${value}x ${label}`,
                                                    fillStyle: data.datasets[0].backgroundColor[i],
                                                    strokeStyle: data.datasets[0].borderColor,
                                                    lineWidth: data.datasets[0].borderWidth,
                                                    hidden: false,
                                                    index: i
                                                };
                                            });
                                        }
                                        return [];
                                    }
                                } 
                            },
                            tooltip: {
                                callbacks: {
                                    label: (context) => `Quantidade: ${context.raw}`
                                }
                            }
                        }
                    }
                });
            }
        }

        function stockSummary(product) {
            const reserved = appState.sales.filter(s => s.status !== 'cancelled' && saleDeliveryState(s) !== 'delivered').reduce((sum,s) => sum + (s.items || []).filter(i => i.productId === product.id).reduce((n,i) => n + i.qty,0),0);
            return { available: Math.max(0,product.stock), reserved, toProduce: Math.max(0,-product.stock) };
        }

        function filterInventory() {
            const search = document.getElementById('inventory-search')?.value.toLowerCase() || '';
            const cat = document.getElementById('inventory-filter-cat')?.value || '';
            
            const filtered = appState.inventory.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(search) || p.code.toLowerCase().includes(search);
                const matchesCat = cat === '' || p.category === cat;
                return matchesSearch && matchesCat;
            });

            const container = document.getElementById('inventory-list');
            if (!container) return;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full py-12 text-center bg-white dark:bg-slate-800 rounded-3xl border border-dashed border-slate-200 dark:border-slate-700">
                        <i data-lucide="package-search" class="w-12 h-12 text-slate-200 mx-auto mb-3"></i>
                        <p class="text-sm text-slate-400 font-bold uppercase tracking-widest">Nenhum produto encontrado</p>
                    </div>
                `;
            } else {
                container.innerHTML = filtered.map(p => renderInventoryCard(p)).join('');
            }
            
            try {
                lucide.createIcons();
            } catch (_) {}
        }

            const sellContainer = document.getElementById('p-sell-container');
            const helperContainer = document.getElementById('p-helper-container');

            if (sellContainer) sellContainer.classList.toggle('hidden', type === 'raw');
            if (helperContainer) helperContainer.classList.toggle('hidden', type === 'raw');

                const helperInput = document.getElementById('p-helper');

        function addRecipeItem() {
            const container = document.getElementById('recipe-items');
            const div = document.createElement('div');
            div.innerHTML = renderRecipeItem();
            container.appendChild(div.firstElementChild);
            lucide.createIcons();
            
            // Add listeners to new items for cost calculation
            const lastRow = container.lastElementChild;
            lastRow.querySelector('.recipe-material').onchange = calculateRecipeCost;
            lastRow.querySelector('.recipe-qty').oninput = calculateRecipeCost;
        }

        let lastCalculatedCost = 0;

        function calculateRecipeCost() {
            let totalCost = 0;
            document.querySelectorAll('.recipe-row').forEach(row => {
                const mId = parseInt(row.querySelector('.recipe-material').value);
                const mQty = parseFloat(row.querySelector('.recipe-qty').value) || 0;
                if (mId) {
                    const material = appState.inventory.find(m => m.id === mId);
                    if (material) {
                        totalCost += (material.costPrice * mQty);
                    }
                }
            });

            lastCalculatedCost = totalCost;
            const display = document.getElementById('recipe-total-cost');
            const btnApply = document.getElementById('btn-apply-cost');
            
            if (display) {
                display.innerText = `Custo Matéria-Prima: ${formatCurrency(totalCost)}`;
                if (totalCost > 0) {
                    display.classList.add('bg-success/10', 'text-success', 'border-success/20');
                    display.classList.remove('bg-primary-50', 'text-primary-600', 'border-primary-100');
                    btnApply.classList.remove('hidden');
                } else {
                    display.classList.remove('bg-success/10', 'text-success', 'border-success/20');
                    display.classList.add('bg-primary-50', 'text-primary-600', 'border-primary-100');
                    btnApply.classList.add('hidden');
                }
            }
        }

        function applyRecipeCost() {
            const costInput = document.getElementById('p-cost');
            if (costInput && lastCalculatedCost > 0) {
                costInput.value = lastCalculatedCost.toFixed(2);
                showToast('Custo de fabricação aplicado!');
            }
        }

            if (confirm('Deseja realmente excluir este produto?')) {
                appState.inventory = appState.inventory.filter(p => p.id !== id);
                saveData();
                renderEstoque();

        function transactionPaymentLabel(transaction) {
            const method = transaction.paymentMethod || 'Não informado';
            if (!/crédito/i.test(method)) return method;
            let installments = transaction.installments;
            if (!Number.isInteger(installments) || installments < 1) {
                const sale = appState.sales.find(s => s.id === transaction.saleId);
                const candidates = (sale?.payments || []).filter(p => p.method === method && Math.round(p.amount * 100) === Math.round(transaction.amount * 100));
                if (candidates.length === 1) installments = candidates[0].installments;
                else if (!(sale?.payments || []).length && sale?.paymentMethod === method) installments = sale.installments;
            }
            return method + (Number.isInteger(installments) && installments > 0 ? ' em ' + installments + 'x' : ' · parcelas não registradas');
        }

        function filterFullStatement() {
            const search = document.getElementById('statement-search').value.toLowerCase();
            const start = document.getElementById('statement-start').value;
            const end = document.getElementById('statement-end').value;
            const type = document.getElementById('statement-type').value;

            // Agrupar transações filtradas
            const groupedFiltered = [];
            const processedSaleIds = new Set();

            appState.transactions.slice().reverse().forEach(t => {
                const matchesSearch = !search || t.description.toLowerCase().includes(search) || t.category.toLowerCase().includes(search);
                const matchesType = type === '' || t.type === type;
                const matchesDate = (!start || t.date >= start) && (!end || t.date <= end);

                if (matchesSearch && matchesType && matchesDate) {
                    if (t.saleId) {
                        if (!processedSaleIds.has(t.saleId)) {
                            const saleGroup = appState.transactions.filter(x => x.saleId === t.saleId);
                            const mainEntry = saleGroup.find(x => x.type === 'entrada') || t;
                            const sale = appState.sales.find(s => s.id === t.saleId);
                            
                            const totalGross = saleGroup.filter(x => x.type === 'entrada').reduce((acc, x) => acc + x.amount, 0);
                            const totalFees = saleGroup.filter(x => x.type === 'saida' && x.category === 'Taxas de Cartão').reduce((acc, x) => acc + x.amount, 0);
                            const totalHelper = saleGroup.filter(x => x.type === 'saida' && (x.category === 'Pagamento de Ajudante' || x.isHelperPayment)).reduce((acc, x) => acc + x.amount, 0);
                            
                            groupedFiltered.push({
                                ...mainEntry,
                                type: 'entrada',
                                isGroup: true,
                                amount: totalGross,
                                fees: totalFees,
                                helperCost: totalHelper,
                                description: `Venda — ${sale ? sale.clientName : (mainEntry.description.split(' - ')[1] || 'Consumidor Final')}`
                            });
                            processedSaleIds.add(t.saleId);
                        }
                    } else {
                        groupedFiltered.push({ ...t, isGroup: false });
                    }
                }
            });

            document.getElementById('full-statement-list').innerHTML = groupedFiltered.map(t => renderFintechRow(t)).join('') || 
                '<div class="p-12 text-center text-slate-400 italic">Nenhuma movimentação encontrada.</div>';
            lucide.createIcons();
        }

        function applyCashFilter() {
            const search = document.getElementById('filter-search').value.toLowerCase();
            const start = document.getElementById('filter-start').value;
            const end = document.getElementById('filter-end').value;
            const type = document.getElementById('filter-type').value;

            const filtered = appState.transactions.filter(t => {
                const matchesSearch = !search || t.description.toLowerCase().includes(search) || t.category.toLowerCase().includes(search);
                const matchesType = type === '' || t.type === type;
                const matchesDate = (!start || t.date >= start) && (!end || t.date <= end);
                return matchesSearch && matchesType && matchesDate;
            });

            closeModal();
            renderCaixaFiltered(filtered);
        }

        function renderCaixaFiltered(transactions) {
            // Agrupar transações filtradas para o modal de filtro
            const groupedFiltered = [];
            const processedSaleIds = new Set();

            transactions.slice().reverse().forEach(t => {
                if (t.saleId) {
                    if (!processedSaleIds.has(t.saleId)) {
                        const saleGroup = appState.transactions.filter(x => x.saleId === t.saleId);
                        const mainEntry = saleGroup.find(x => x.type === 'entrada') || t;
                        const sale = appState.sales.find(s => s.id === t.saleId);
                        
                        const totalGross = saleGroup.filter(x => x.type === 'entrada').reduce((acc, x) => acc + x.amount, 0);
                        const totalFees = saleGroup.filter(x => x.type === 'saida' && x.category === 'Taxas de Cartão').reduce((acc, x) => acc + x.amount, 0);
                        const totalHelper = saleGroup.filter(x => x.type === 'saida' && (x.category === 'Pagamento de Ajudante' || x.isHelperPayment)).reduce((acc, x) => acc + x.amount, 0);
                        
                        groupedFiltered.push({
                            ...mainEntry,
                            type: 'entrada',
                            isGroup: true,
                            amount: totalGross,
                            fees: totalFees,
                            helperCost: totalHelper,
                            description: `Venda — ${sale ? sale.clientName : (mainEntry.description.split(' - ')[1] || 'Consumidor Final')}`
                        });
                        processedSaleIds.add(t.saleId);
                    }
                } else {
                    groupedFiltered.push({ ...t, isGroup: false });
                }
            });

            renderCaixa(); // Reset layout base
            const container = document.querySelector('.divide-y');
            if (container) {
                container.innerHTML = groupedFiltered.map(t => renderFintechRow(t)).join('') || 
                    '<div class="p-12 text-center text-slate-400 italic">Nenhuma movimentação para este filtro.</div>';
                lucide.createIcons();
            }
        }

        function deleteTransaction(id) {
            const transaction = appState.transactions.find(t => t.id === id);
            if (!transaction) return;
            if (transaction.saleId != null) {
                showToast('Este lançamento pertence a uma venda e não pode ser apagado separadamente.', 'error');
                return;
            }
            if (confirm('Deseja realmente excluir esta transação?')) {
                appState.transactions = appState.transactions.filter(t => t.id !== id);
                saveData();
                renderCaixa();
                showToast('Transação excluída.', 'error');
            }
        }

                            <button id="client-next" type="submit" class="flex-1 min-h-[48px] px-4 rounded-xl bg-primary-600 text-white font-semibold">Próximo</button>

                    </form>
                </div>
            `;
            openModal(html);
            const form = document.getElementById('client-form');
            const steps = [...form.querySelectorAll('[data-client-step]')];
            const titles = ['Dados do cliente', 'Contato (opcional)', 'Endereço de entrega (opcional)'];
            let step = 0;
            const showStep = (focus = true) => {
                steps.forEach((panel, index) => {
                    panel.hidden = index !== step;
                    panel.style.display = index === step ? '' : 'none';
                });
                const heading = document.getElementById('client-step-title');
                heading.textContent = 'Etapa ' + (step + 1) + ' de 3 · ' + titles[step];
                document.getElementById('client-step-progress').style.width = ((step + 1) / 3 * 100) + '%';
                document.getElementById('client-back').textContent = step === 0 ? 'Cancelar' : 'Voltar';
                document.getElementById('client-next').textContent = step === 2 ? 'Salvar cliente' : 'Próximo';
                if (focus) heading.focus();
            };
            form.querySelectorAll('input, select').forEach(field => {
                field.style.fontSize = '16px';
                field.style.minHeight = '48px';
                const label = field.parentElement.querySelector('label');
                if (label) label.htmlFor = field.id;
            });
            document.getElementById('client-back').onclick = () => {
                if (step === 0) { closeModal(); return; }
                step--;
                showStep();
            };
            showStep(false);
            document.getElementById('client-form').onsubmit = (e) => {
                e.preventDefault();
                const nameField = document.getElementById('c-name');
                nameField.setCustomValidity(nameField.value.trim() ? '' : 'Informe o nome do cliente.');
                const panelsToValidate = step === 2 ? steps : [steps[step]];
                for (const panel of panelsToValidate) {
                    const invalid = [...panel.querySelectorAll('input, select')].find(field => !field.checkValidity());
                    if (invalid) {
                        step = steps.indexOf(panel);
                        showStep(false);
                        invalid.reportValidity();
                        return;
                    }
                }
                if (step < 2) { step++; showStep(); return; }
                
                const street = document.getElementById('c-street').value;
                const block = document.getElementById('c-block').value;
                const number = document.getElementById('c-number').value;
                const neighbor = document.getElementById('c-neighbor').value;
                const city = document.getElementById('c-city').value;
                const state = document.getElementById('c-state').value;
                
                // Formatar endereço completo para compatibilidade com versões anteriores
                let fullAddr = street;
                if (block) fullAddr += `, Qd ${block}`;
                if (number) fullAddr += `, Nº ${number}`;
                if (neighbor) fullAddr += ` - ${neighbor}`;
                if (city) fullAddr += `, ${city}`;
                if (state) fullAddr += `/${state.toUpperCase()}`;

                const newClient = {
                    id: client ? client.id : Date.now(),
                    name: document.getElementById('c-name').value,
                    taxId: document.getElementById('c-tax').value,
                    type: document.getElementById('c-type').value,
                    phone: document.getElementById('c-phone').value,
                    email: document.getElementById('c-mail').value,
                    street: street,
                    block: block,
                    number: number,
                    neighborhood: neighbor,
                    city: city,
                    state: state,
                    reference: document.getElementById('c-ref').value,
                    address: fullAddr // Mantido para compatibilidade
                };
                if (client) {
                    const idx = appState.clients.findIndex(c => c.id === clientId);
                    appState.clients[idx] = newClient;
                } else {
                    appState.clients.push(newClient);
                }
                saveData(); closeModal(); renderClientes();
                showToast(client ? 'Cliente atualizado!' : 'Cliente cadastrado!');
            };
        }

                            </label>
                        </div>

                        <div class="flex flex-col sm:flex-row justify-end gap-3 pt-4 border-t border-slate-100 dark:border-slate-700">
                            <button type="button" onclick="closeModal()" class="w-full sm:w-auto px-6 py-4 sm:py-2.5 rounded-2xl border border-slate-200 dark:border-slate-700 font-black text-xs uppercase tracking-widest hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">Cancelar</button>
                            <button type="submit" id="btn-confirm-stock" class="w-full sm:w-auto px-6 py-4 sm:py-2.5 rounded-2xl bg-primary-600 text-white font-black text-xs uppercase tracking-widest hover:brightness-95 shadow-lg shadow-primary-500/20 transition-all active:scale-95">Confirmar Ajuste</button>
                        </div>
                    </form>
                </div>
            `;
            openModal(html);
            try { lucide.createIcons(); } catch (_) {}
            
            const unitInput = document.getElementById('sm-price');
            const totalInput = document.getElementById('sm-total');
            const qtyInput = document.getElementById('sm-qty');
            const prodSelect = document.getElementById('sm-prod');
            const typeSelect = document.getElementById('sm-type');
            const genExpenseCheck = document.getElementById('sm-gen-expense');
            const form = document.getElementById('stock-move-form');

            const calcTotal = () => {
                const qty = parseFloat(qtyInput.value) || 0;
                const unit = parseFloat(unitInput.value) || 0;
                if (qty > 0 && unit >= 0) totalInput.value = (qty * unit).toFixed(2);
            };

            const calcUnit = () => {
                const qty = parseFloat(qtyInput.value) || 0;
                const total = parseFloat(totalInput.value) || 0;
                if (qty > 0 && total >= 0) unitInput.value = (total / qty).toFixed(2);
            };

            if (unitInput) unitInput.oninput = calcTotal;
            if (totalInput) totalInput.oninput = calcUnit;
            if (qtyInput) qtyInput.oninput = calcTotal;

            if (form) {
                form.onsubmit = (e) => {
                    e.preventDefault();
                    
                    try {
                        const pId = parseInt(prodSelect.value);
                        if (isNaN(pId)) {
                            showToast("Por favor, selecione um produto.", "error");
                            return;
                        }

                        const type = typeSelect.value;
                        const qty = parseFloat(qtyInput.value);
                        if (isNaN(qty) || qty <= 0) {
                            showToast("Por favor, informe uma quantidade válida.", "error");
                            return;
                        }

                        const unitPrice = parseFloat(unitInput?.value) || 0;
                        const totalPrice = parseFloat(totalInput?.value) || 0;
                        const genExpense = genExpenseCheck?.checked || false;
                        
                        const product = appState.inventory.find(p => p.id === pId);
                        if (!product) {
                            showToast("Produto não encontrado.", "error");
                            return;
                        }

                        const oldStock = product.stock;
                        if (type === 'entrada') {
                            product.stock += qty;
                        } else {
                            product.stock = Math.max(0, product.stock - qty);
                        }
                        
                        // Inicializa stockMovements se não existir (segurança extra)
                        if (!Array.isArray(appState.stockMovements)) appState.stockMovements = [];

                        // Grava no histórico de movimentos
                        const movement = {
                            id: Date.now(),
                            productId: pId,
                            productName: product.name,
                            type: type,
                            qty: qty,
                            unitPrice: unitPrice,
                            totalPrice: totalPrice,
                            date: localDate(),
                            oldStock: oldStock,
                            newStock: product.stock
                        };
                        appState.stockMovements.push(movement);

                        // Se for entrada com preço e marcado para gerar despesa
                        if (type === 'entrada' && totalPrice > 0 && genExpense) {
                            if (!Array.isArray(appState.transactions)) appState.transactions = [];
                            
                            const trans = {
                                id: Date.now() + 1,
                                type: 'saida',
                                description: `Compra: ${qty} ${product.unit} de ${escapeHtml(product.name)}`,
                                amount: totalPrice,
                                date: movement.date,
                                category: 'Compra de Matéria-Prima',
                                account: 'Caixa Principal',
                                paymentMethod: 'Dinheiro'
                            };
                            appState.transactions.push(trans);
                        }

                        // Atualiza custo médio do produto se for entrada
                        if (type === 'entrada' && unitPrice > 0) {
                            product.costPrice = unitPrice;
                        }
                        
                        saveData(); 
                        closeModal(); 
                        renderEstoque(); 
                        showToast(`Estoque de ${escapeHtml(product.name)} atualizado!`);
                    } catch (err) {
                        console.error("Erro ao processar ajuste de estoque:", err);
                        showToast("Erro ao processar o ajuste. Tente novamente.", "error");
                    }
                };
            }
        }

            let html = `

                const date = localDate();

                // 1. Record final payment in history
                emp.history.push({
                    id: Date.now(),
                    type: 'pagamento',
                    amount: netAmount,
                    date: date,
                    description: `Fechamento Salário ${emp.payCycle}`
                });

                // 2. Clear current advances (they are now settled)
                // We mark them as 'settled' or just filter them out for the next balance calculation

                emp.history.forEach(h => {
                    if (h.type === 'vale') h.type = 'vale_pago';

                // 3. Record in Cash Flow
                appState.transactions.push({
                    id: Date.now() + 1,
                    type: 'saida',
                    category: 'Folha de Pagamento',
                    amount: netAmount,
                    date: date,
                    description: `PAGTO SALÁRIO: ${escapeHtml(emp.name)} (${emp.payCycle})`,
                    account: 'Caixa Principal',
                    paymentMethod: 'PIX'
                });

                saveData();
                closeModal();
                renderFuncionarios();
                showToast(`Pagamento de ${formatCurrency(netAmount)} realizado!`);

                const matchesSearch = (s.clientName || '').toLowerCase().includes(query);
                const matchesStatus = statusFilter === 'all' ? (s.status === 'completed' || s.status === 'cancelled') : s.status === statusFilter;

            });
            
            const container = document.getElementById('history-table-body');
            if (!container) return;

            container.innerHTML = filteredSales.slice().reverse().map(s => {
                const isCancelled = s.status === 'cancelled';
                const statusLabel = isCancelled ? 'Cancelada' : 'Concluída';
                const statusColor = isCancelled ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600';

                return `
                    <tr onclick="openSaleDetailsModal(${s.id})" class="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors cursor-pointer group">
                        <td class="px-6 py-4 font-bold">#${s.id}</td>
                        <td class="px-6 py-4 font-medium text-slate-500">${formatDate(s.date)}</td>
                        <td class="px-6 py-4 font-bold text-slate-900 dark:text-white uppercase tracking-tight">${escapeHtml(s.clientName)}</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 rounded-full text-[9px] font-black uppercase tracking-widest ${statusColor}">${statusLabel}</span>
                        </td>
                        <td class="px-6 py-4 text-right font-black ${isCancelled ? 'text-slate-400 line-through' : 'text-green-600'}">${formatCurrency(s.total)}</td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex justify-end gap-2">
                                <button onclick="event.stopPropagation(); openSaleManagement(${Number(s.id)})" class="p-2 text-primary-600" title="Gerenciar pedido">Gerenciar</button>
                                <button onclick="event.stopPropagation(); reprintReceipt(${s.id})" class="p-2 text-primary-600 hover:bg-primary-50 dark:hover:bg-primary-900/20 rounded-xl transition-all group-hover:scale-110" title="Reimprimir Cupom">
                                    <i data-lucide="printer" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('') || '<tr><td colspan="6" class="px-6 py-12 text-center text-slate-400 italic">Nenhuma venda encontrada.</td></tr>';
            lucide.createIcons();
        }

        function reprintReceipt(saleId) {
            const sale = appState.sales.find(s => s.id === saleId);
            if (sale?.status === 'cancelled') { showToast('Pedido cancelado: consulte o histórico de estorno.', 'error'); return; }
            if (sale) {
                generateReceiptPDF(sale);
                showToast(`Recibo #${saleId} gerado com sucesso!`);
            }
        }
